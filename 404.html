<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>hello</title>
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#fbfbfd; --ink:#1d1d1f; --muted:rgba(29,29,31,.4); }
  @media (prefers-color-scheme: dark){ :root{ --bg:#000; --ink:#f5f5f7; --muted:rgba(245,245,247,.45);} }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    text-align:center;padding:6vw;
  }
  .word{
    font-family:"Dancing Script","Snell Roundhand",cursive;font-weight:700;
    font-size:clamp(4rem,18vw,11rem);line-height:1;
  }
  .sub{color:var(--muted);font-size:.95rem;letter-spacing:.03em}
  a{color:inherit;text-decoration:none;border-bottom:1px solid var(--muted);padding-bottom:1px}
</style>
</head>
<body>
  <div class="word">oops</div>
  <p class="sub">这里什么都没有 · <a href="/">回到 hello</a></p>
</body>
</html>
