<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>hello</title>
<meta name="description" content="hello — 你好" />
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fbfbfd;
    --bg-glow: rgba(0, 0, 0, 0.035);
    --ink: #1d1d1f;
    --muted: rgba(29, 29, 31, 0.28);
    --indicator: rgba(29, 29, 31, 0.22);
    --reveal: 1600ms;
    --hold: 1500ms;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --bg-glow: rgba(255, 255, 255, 0.06);
      --ink: #f5f5f7;
      --muted: rgba(245, 245, 247, 0.32);
      --indicator: rgba(245, 245, 247, 0.3);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    background-image: radial-gradient(120% 90% at 50% 42%, var(--bg-glow) 0%, transparent 60%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
    display: grid;
    grid-template-rows: 1fr auto;
    min-height: 100vh;
    min-height: 100svh;
  }

  /* visually hidden, kept for screen readers / SEO */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .stage {
    grid-row: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 6vw;
  }

  .greeting {
    font-size: clamp(3.25rem, 17vw, 12.5rem);
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-align: center;
    white-space: nowrap;
    will-change: clip-path, opacity, transform;
    /* leading edge clipped — gets "written" left→right */
    clip-path: inset(0 100% -25% 0);
    opacity: 0;
    transform: translateZ(0);
  }

  /* Latin greetings get the flowing Apple-style script */
  .greeting.script {
    font-family: "Dancing Script", "Snell Roundhand", "Segoe Script", cursive;
    font-weight: 700;
    letter-spacing: 0.005em;
    font-size: clamp(4rem, 21vw, 15rem);
  }

  .greeting.writing {
    animation: write var(--reveal) cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .greeting.leaving {
    animation: leave 620ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  /* RTL languages get written right→left */
  .greeting.rtl { direction: rtl; clip-path: inset(0 0 -25% 100%); }
  .greeting.rtl.writing { animation-name: write-rtl; }

  @keyframes write {
    0%   { clip-path: inset(0 100% -25% 0); opacity: 0; }
    12%  { opacity: 1; }
    100% { clip-path: inset(0 0 -25% 0); opacity: 1; }
  }

  @keyframes write-rtl {
    0%   { clip-path: inset(0 0 -25% 100%); opacity: 0; }
    12%  { opacity: 1; }
    100% { clip-path: inset(0 0 -25% 0); opacity: 1; }
  }

  @keyframes leave {
    0%   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    100% { opacity: 0; transform: translateY(-0.28em) scale(0.985); filter: blur(2px); }
  }

  .footer {
    grid-row: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: 0 0 calc(22px + env(safe-area-inset-bottom));
  }

  .hint {
    font-size: 0.84rem;
    letter-spacing: 0.04em;
    color: var(--muted);
    opacity: 0;
    animation: hintIn 900ms ease 1100ms forwards;
  }

  /* iPhone-style home indicator */
  .home-indicator {
    width: 134px;
    height: 5px;
    border-radius: 999px;
    background: var(--indicator);
    opacity: 0;
    animation: hintIn 900ms ease 1400ms forwards;
  }

  @keyframes hintIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .greeting { transition: opacity 500ms ease; clip-path: none !important; }
    .greeting.writing, .greeting.leaving { animation: none; }
    .greeting.rtl { direction: rtl; }
    .hint, .home-indicator { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <h1 class="sr-only">Hello — 你好。庞天凯的主页 hhhh.fun</h1>

  <main class="stage">
    <span class="greeting script" id="greeting" aria-hidden="true">hello</span>
  </main>

  <footer class="footer">
    <span class="hint" id="hint">向上轻扫以继续</span>
    <div class="home-indicator" aria-hidden="true"></div>
  </footer>

  <script>
    (function () {
      // { text, rtl?, script? } — script:true uses the cursive face (Latin only)
      var GREETINGS = [
        { t: "hello", script: true },
        { t: "你好" },
        { t: "Bonjour", script: true },
        { t: "안녕하세요" },
        { t: "こんにちは" },
        { t: "Hola", script: true },
        { t: "Ciao", script: true },
        { t: "Hallo", script: true },
        { t: "Olá", script: true },
        { t: "Привет" },
        { t: "مرحبا", rtl: true },
        { t: "नमस्ते" },
        { t: "สวัสดี" },
        { t: "Merhaba", script: true }
      ];

      var el = document.getElementById("greeting");
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      var REVEAL = 1600;   // first word draws slowly — the signature beat
      var REVEAL_NEXT = 950;
      var HOLD = 1450;
      var HOLD_NEXT = 1150;
      var LEAVE = 620;

      var i = 0;
      var first = true;

      function applyClasses(g) {
        el.className = "greeting" + (g.script ? " script" : "") + (g.rtl ? " rtl" : "");
      }

      function show() {
        var g = GREETINGS[i];
        var reveal = first ? REVEAL : REVEAL_NEXT;
        var hold = first ? HOLD : HOLD_NEXT;

        el.textContent = g.t;
        applyClasses(g);
        el.style.setProperty("--reveal", reveal + "ms");

        if (reduceMotion) {
          // simple, calm cross-fade for reduced-motion users
          el.style.opacity = "1";
          el.style.clipPath = "none";
          window.setTimeout(fadeOutReduced, hold + 400);
          return;
        }

        // restart the write animation
        el.classList.remove("writing", "leaving");
        void el.offsetWidth; // reflow to replay
        el.classList.add("writing");

        window.setTimeout(leave, reveal + hold);
      }

      function leave() {
        el.classList.remove("writing");
        void el.offsetWidth;
        el.classList.add("leaving");
        window.setTimeout(next, LEAVE);
      }

      function fadeOutReduced() {
        el.style.transition = "opacity 500ms ease";
        el.style.opacity = "0";
        window.setTimeout(function () {
          el.style.transition = "";
          next();
        }, 520);
      }

      function next() {
        first = false;
        i = (i + 1) % GREETINGS.length;
        show();
      }

      // wait for the script font so "hello" doesn't flash in a fallback face
      function start() { show(); }
      if (document.fonts && document.fonts.ready) {
        var started = false;
        var go = function () { if (!started) { started = true; start(); } };
        document.fonts.ready.then(go);
        window.setTimeout(go, 700); // safety net
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
